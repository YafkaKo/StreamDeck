// Настройки MatchZy для турнира (копируются на сервер при каждом start-server.bat).
// Остальные значения - по умолчанию плагина. Правила раундов MatchZy берёт из своего live.cfg (они как на FACEIT).

matchzy_knife_enabled_default true      // нож-раунд за выбор стороны
matchzy_minimum_ready_required 0        // 0 = матч стартует, когда !ready написали ВСЕ подключённые игроки
matchzy_allow_force_ready true          // админ может стартовать матч сам (кнопка в панели)
matchzy_kick_when_no_match_loaded false
matchzy_demo_recording_enabled false    // демо уже пишет сам сервер (tv_autorecord в server.cfg)
matchzy_hostname_format ""              // оставляем hostname из server.cfg
matchzy_enable_tech_pause true          // !tech - техническая пауза
matchzy_everyone_is_admin false