// Выполняется при каждой загрузке карты. Сервер, пароли, сеть.
hostname "Kiberarena Tournament"
sv_password "arena2026"        // пароль для входа: игроки и комментатор
rcon_password "admin-change-me" // пароль удалённого управления, поменяйте
sv_lan 1                        // только локальная сеть, без проверки серверами Valve
sv_cheats 0
sv_allow_votes 0                // никаких голосований, всё решает админ
sv_hibernate_when_empty 0

// Без ботов
bot_quota 0
bot_kick

// GOTV: комментатор/трансляция подключаются на порт 27020
tv_enable 1
tv_name "Kiberarena GOTV"
tv_password "arena2026"
// tv_delay не трогаем: стандартные 105 с. С tv_delay 0 игроков выкидывало при входе (NETWORK_DISCONNECT_OVERFLOW).
tv_autorecord 1                 // демо каждой карты пишутся в game\csgo — пригодятся для споров
tv_maxclients 5

// Лог
log on
sv_logfile 1
