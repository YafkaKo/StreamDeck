// Правила по образцу FACEIT: MR12, заморозка 20 с, овертаймы MR3 с $10000.
// Правила матча. CS2 выполняет этот файл после gamemode_competitive.cfg при каждой смене карты,
// поэтому настройки не слетают при changelevel.

// MR12: 24 раунда, смена сторон после 12-го, досрочная победа на 13
mp_maxrounds 24
mp_halftime 1
mp_match_can_clinch 1

// Овертаймы MR3 (по 6 раундов), $10000 на старте овертайма (как на FACEIT)
mp_overtime_enable 1
mp_overtime_maxrounds 6
mp_overtime_startmoney 10000
mp_overtime_halftime_pausetimer 0

// Экономика и время
mp_startmoney 800
mp_maxmoney 16000
mp_freezetime 20
mp_buytime 20
mp_buy_anywhere 0
mp_roundtime 1.92
mp_roundtime_defuse 1.92
mp_roundtime_hostage 1.92
mp_c4timer 40
mp_round_restart_delay 7

// Команды и игроки
mp_autoteambalance 0
mp_limitteams 0
mp_spectators_max 2             // слот для комментатора
mp_autokick 0
mp_friendlyfire 1
ff_damage_reduction_bullets 0         // урон по своим только от гранат: пули 0
ff_damage_reduction_grenade 0.85
ff_damage_reduction_grenade_self 1
ff_damage_reduction_other 0.4
mp_solid_teammates 1
mp_free_armor 0
mp_death_drop_gun 1
mp_forcecamera 1                // мёртвые игроки видят только свою команду
sv_deadtalk 0
sv_alltalk 0
sv_talk_enemy_dead 0
sv_talk_enemy_living 0

// Тайм-ауты: 3 по 30 секунд на команду
mp_team_timeout_max 3
mp_team_timeout_time 30
mp_technical_timeout_per_team 3
mp_team_timeout_ot_add_once 1      // +1 тайм-аут каждой команде в первом овертайме (как на FACEIT)
mp_team_timeout_ot_add_each 1      // и ещё по одному в каждом следующем
mp_team_timeout_ot_max 1

// Разминка без ограничения по времени: матч стартует, когда админ введёт mp_warmup_end
mp_warmuptime 9999
mp_warmup_pausetimer 1

// Без ботов (gamemode_competitive.cfg их добавляет обратно)
bot_quota 0
bot_kick
